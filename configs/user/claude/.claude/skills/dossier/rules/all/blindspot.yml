rules:
  - id: dossier.all.blindspot.codegen
    message: Generated code
    languages: [generic]
    severity: INFO
    metadata: {category: blindspot, pattern: codegen}
    pattern-regex: (?i)(do not edit|@generated|auto-?generated by)

  - id: dossier.all.blindspot.feature-flag
    message: Behaviour switched by feature flags
    languages: [generic]
    severity: INFO
    metadata: {category: blindspot, pattern: feature-flag}
    pattern-regex: (?i)(?<!blindspot\.)(feature[_-]?flag|launchdarkly|unleash|flagsmith|growthbook)
