[project]
name = "shopcart"
version = "1.0"
requires-python = ">=3.11"

[project.scripts]
shopcart = "shopcart.cli:main"  # @ep-script

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/shopcart"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.coverage.report]
fail_under = 80

[tool.importlinter]
root_package = "shopcart"

[[tool.importlinter.contracts]]
name = "cli above core"
type = "layers"
layers = ["shopcart.cli", "shopcart.core"]

[[tool.importlinter.contracts]]
name = "apps apart"
type = "independence"
modules = ["shopcart.plugins", "shopcart.store"]
