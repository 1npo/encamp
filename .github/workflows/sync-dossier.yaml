name: Sync dossier

# The dossier skill lives in https://github.com/1npo/dossier and is vendored here as a git subtree
# (configs/user/claude/.claude/skills/dossier). This workflow pulls new commits from its main branch and
# puts them on the branch chore/sync-dossier, with a pull request into main. Merge it, then run `encamp-sync pull`.
#
# Never edit the vendored folder here: change 1npo/dossier. Edits made here conflict with the next sync.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

env:
  PREFIX: configs/user/claude/.claude/skills/dossier
  UPSTREAM: https://github.com/1npo/dossier.git
  BRANCH: chore/sync-dossier

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Pull dossier main into the branch
        id: pull
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git subtree pull --prefix="$PREFIX" "$UPSTREAM" main --squash \
            -m "chore(dossier): sync from 1npo/dossier"
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "dossier is up to date"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "version=$(tr -d '[:space:]' < "$PREFIX/VERSION")" >> "$GITHUB_OUTPUT"
          fi

      - name: Push the branch and open or update the pull request
        if: steps.pull.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git push --force origin "$BRANCH"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(dossier): sync from 1npo/dossier (${{ steps.pull.outputs.version }})" \
              --body "Vendored copy updated from the main branch of 1npo/dossier. Merge, then run \`encamp-sync pull\`." \
              || echo "::warning::Could not open a pull request (enable 'Allow GitHub Actions to create and approve pull requests' in the repository settings). The branch $BRANCH is pushed."
          fi
